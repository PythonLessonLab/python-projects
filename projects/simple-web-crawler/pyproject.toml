[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonlessonlab-simple-crawler"
version = "0.1.0"
description = "A bounded, respectful web crawler for a Python tutorial"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PythonLessonLab" }]
dependencies = []

[project.scripts]
pythonlessonlab-crawl = "pythonlessonlab_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
